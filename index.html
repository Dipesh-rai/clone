<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/6f4be6c4fc.js" crossorigin="anonymous"></script>
</head>

<body>
    <header class="mt-5">
        <div class="container mx-auto">
            <h1 class="w-[300px] mx-auto py-[10px]"><img src="images/logo.png" alt=""></h1>
            <nav class="mx-auto">
                <ul class="flex text-white gap-x-5 justify-center m-0 font-[800] text-[19px] leading-[19px] uppercase"
                    id="navbar">

                </ul>
            </nav>
        </div>
    </header>

    <section>
        <div class="container mx-auto">
            <div class="banner">
                <div class="banner-img h-1vh p-10" id="banner_image">
                    
                </div>
            </div>
        </div>
    </section>
    <section>
        <div class="container mx-auto flex justify-center mt-5">
            <div class="subscribe-part">
                <h2 class="text-white text-center">Subscribe</h2>
                <div class="mt-2 flex justify-center">
                    <div class=" subscribe ">
                        <div class="text">
                            <input type="text" class="input-class">
                        </div>
                        <div class="btn-btnb">
                            <button class="btn">Join</button>
                        </div>
                    </div>
                </div>
                <div class="policy flex mt-3 gap-x-2">
                    <input type="checkbox" name="" id="">
                    <label for="">I want Warner Music Group to send me marketing messages about Bruno Mars. Unsubscribe
                        at any time. Please read our Privacy Policy for more information about how we handle your
                        personal information, including for marketing.</label>
                </div>
            </div>
        </div>
    </section>
    <footer>
        <div class="flex gap-x-8 justify-center" id="media">
           
        </div>

        <div class="copyright flex justify-center">
            <p id="copyright_href" class="flex gap-2">©  2025 Atlantic records</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
